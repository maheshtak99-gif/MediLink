
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseGlow {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 0px rgba(0, 211, 138, 0)); }
      50% { filter: hue-rotate(45deg) drop-shadow(0 0 10px rgba(0, 211, 138, 0.8)) brightness(1.2); }
      100% { filter: hue-rotate(0deg) drop-shadow(0 0 0px rgba(0, 211, 138, 0)); }
    }
    .glowing {
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
      transform-origin: center;
    }
  </style>
  <defs>
    <linearGradient id="medilink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#00d38a" />
    </linearGradient>
  </defs>
  <g class="glowing">
    <rect x="20" y="0" width="60" height="100" rx="15" fill="url(#medilink)" />
    <rect x="0" y="20" width="100" height="60" rx="15" fill="url(#medilink)" />
  </g>
</svg>
