
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes colorPulse {
      0% { fill: #00D38A; }
      50% { fill: #0ea5e9; }
      100% { fill: #00D38A; }
    }
    .animated-cross {
      animation: colorPulse 3s infinite ease-in-out;
      fill: #00D38A; /* Solid vibrant teal fallback */
    }
  </style>
  <g class="animated-cross">
    <rect x="20" y="0" width="60" height="100" rx="14" />
    <rect x="0" y="20" width="100" height="60" rx="14" />
  </g>
</svg>
